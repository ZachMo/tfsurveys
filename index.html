<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Poll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#183A78;--orange:#FF832B;--green:#2E7D0A;--red:#D0182F;
  --bg:#F3F6FB;--card:#FFFFFF;--ink:#1B2433;--muted:#5A6678;--line:#D8E0EC;--pick:#FFF1E6;--head:#183A78;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1526;--card:#16213A;--ink:#EEF2F8;--muted:#A0ACC0;--line:#2A3854;--pick:#3B2614;--head:#FFFFFF;--green:#6CC24A;--red:#FF6B7D;
  }
}
:root[data-theme="dark"]{--bg:#0D1526;--card:#16213A;--ink:#EEF2F8;--muted:#A0ACC0;--line:#2A3854;--pick:#3B2614;--head:#FFFFFF;--green:#6CC24A;--red:#FF6B7D}
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
/* The logo has dark gray lettering, so its strip stays white in dark mode too. */
header{background:#fff;padding:14px 16px 12px;border-bottom:4px solid var(--orange);display:flex;justify-content:center}
header h1{margin:0;line-height:0}
header img{height:56px;width:auto;max-width:100%}
main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:24px 16px 40px}
.eyebrow{font-size:13px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
h2{font-size:25px;line-height:1.25;font-weight:700;margin-bottom:20px;color:var(--head)}
.choices{display:grid;gap:12px}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:14px 16px;border-radius:14px;
  border:2px solid var(--line);background:var(--card);color:var(--ink);font:500 18px/1.3 Outfit,system-ui,sans-serif;text-align:left;cursor:pointer;
  transition:border-color .15s,background .15s,transform .08s}
.choice:active{transform:scale(.98)}
.choice .dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.choice.picked{border-color:var(--orange);background:var(--pick)}
.choice.picked .dot{border-color:var(--orange);background:var(--orange)}
.choice.picked .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.choice:disabled{opacity:.6;cursor:default}
.note{margin-top:18px;font-size:15px;color:var(--muted);min-height:22px}
.note.ok{color:var(--green);font-weight:500}
.note.err{color:var(--red)}
.wait{text-align:center;padding-top:48px}
.wait .pulse{width:56px;height:56px;margin:0 auto 20px;border-radius:50%;background:var(--orange);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1);opacity:1}}
.wait h2{margin-bottom:8px}
.wait p{color:var(--muted);font-size:16px}
.demo{background:#FFF3E8;color:#7A3D07;font-size:13px;padding:8px 16px;text-align:center}
@media (prefers-reduced-motion: reduce){.wait .pulse{animation:none}}
</style>
</head>
<body>
<div id="demo" class="demo" hidden>Demo mode: votes stay in this browser. Add Supabase keys in config.js to go live.</div>
<header><h1><img id="logo" src="navigator-forum-logo.png" alt="Transfinder Navigator Forum" width="161" height="56"></h1></header>
<main id="app"><div class="wait"><div class="pulse"></div><p>Connecting…</p></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="poll.js"></script>
<script>
const app = document.getElementById('app');
const Q = Poll.questions;
let current = null, mine = null, busy = false, note = '', noteCls = '';

document.title = Poll.config.title || 'Live Poll';
document.getElementById('demo').hidden = Poll.live;

function render() {
  if (current == null || current < 0 || !Q[current]) {
    app.innerHTML = `<div class="wait"><div class="pulse"></div>
      <h2>You're in!</h2><p>Hang tight. The next question will show up here.</p></div>`;
    return;
  }
  const q = Q[current];
  app.innerHTML = `<div class="eyebrow">Question ${current + 1} of ${Q.length}</div>
    <h2>${Poll.esc(q.text)}</h2>
    <div class="choices">${q.choices.map((c, i) =>
      `<button class="choice${mine === i ? ' picked' : ''}" data-i="${i}" ${busy ? 'disabled' : ''}>
         <span class="dot"></span><span>${Poll.esc(c)}</span></button>`).join('')}</div>
    <p class="note ${noteCls}" role="status">${Poll.esc(note)}</p>`;
}

app.addEventListener('click', async e => {
  const b = e.target.closest('.choice');
  if (!b || busy) return;
  const i = Number(b.dataset.i), q = current;
  busy = true; mine = i; note = 'Sending…'; noteCls = ''; render();
  try {
    const r = await Poll.vote(q, i);
    if (r === 'ok') { note = 'Your answer is in. Tap another choice to change it.'; noteCls = 'ok'; }
    else if (r === 'closed') { note = 'Voting on this question has closed.'; noteCls = 'err'; mine = null; }
    else { note = 'That answer did not go through. Please try again.'; noteCls = 'err'; mine = null; }
  } catch (err) {
    note = 'No connection. Please try again.'; noteCls = 'err'; mine = null;
  }
  busy = false; render();
});

async function refresh() {
  if (busy) return;
  try {
    const c = await Poll.current();
    if (c !== current) {
      current = c; note = ''; noteCls = '';
      mine = c >= 0 ? await Poll.myVote(c) : null;
      if (mine != null) { note = 'Your answer is in. Tap another choice to change it.'; noteCls = 'ok'; }
      render();
    }
  } catch (err) {
    if (current == null) app.innerHTML = `<div class="wait"><h2>Can't reach the poll</h2><p>Check your connection. This page will keep trying.</p></div>`;
  }
}

if (!Poll.ready) app.innerHTML = `<div class="wait"><h2>Can't load the poll</h2><p>Please refresh the page.</p></div>`;
else { refresh(); Poll.subscribe(refresh); }
</script>
</body>
</html>
