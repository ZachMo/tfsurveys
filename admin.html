<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Live Poll Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#183A78;--orange:#FF832B;--red:#D0182F;--green:#2E7D0A;
  --bg:#F3F6FB;--card:#FFFFFF;--ink:#1B2433;--muted:#5A6678;--line:#D8E0EC;--soft:#EAEFF7;--head:#183A78;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0D1526;--card:#16213A;--ink:#EEF2F8;--muted:#A0ACC0;--line:#2A3854;--soft:#1D2A45;--head:#FFFFFF;--red:#FF6B7D}
}
:root[data-theme="dark"]{--bg:#0D1526;--card:#16213A;--ink:#EEF2F8;--muted:#A0ACC0;--line:#2A3854;--soft:#1D2A45;--head:#FFFFFF;--red:#FF6B7D}
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
/* The logo has dark gray lettering, so its strip stays white in dark mode too. */
header{background:#fff;padding:12px 16px;border-bottom:4px solid var(--orange);display:flex;align-items:center;justify-content:center}
header img{height:48px;width:auto}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:16px}
h1{font-size:22px;color:var(--head)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.card h2 + .row{border-top:0}
.row .n{flex:none;width:28px;font-weight:700;color:var(--orange)}
.row .t{flex:1;min-width:0}
.row .c{flex:none;font-weight:700;font-variant-numeric:tabular-nums;color:var(--head);min-width:3ch;text-align:right}
.row a{color:var(--head);font-weight:600;text-decoration:none}
.row a:hover{text-decoration:underline}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:600 15px Outfit,system-ui,sans-serif;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;cursor:pointer}
button:hover{border-color:var(--navy)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
button.danger{border-color:var(--red);color:var(--red)}
button.armed{background:var(--red);border-color:var(--red);color:#fff}
button.small{font-size:13px;padding:6px 10px}
.signin{display:grid;gap:12px}
.signin input{font:16px Outfit,system-ui,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.err{color:var(--red);font-size:14px;min-height:20px}
.hint{font-size:14px;color:var(--muted);line-height:1.45;margin-top:12px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header><img src="navigator-forum-logo.png" alt="Transfinder Navigator Forum" width="138" height="48"></header>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="poll.js"></script>
<script>
const app = document.getElementById('app');
const Q = Poll.questions;
const site = Poll.voteUrl().replace(/\/(index\.html)?$/, '');
let code = null, counts = {};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400);
}
function ss(k, v) {
  try {
    if (v === undefined) return sessionStorage.getItem(k);
    v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v);
  } catch (e) {}
  return null;
}
const totalOf = qi => Object.values(counts[qi] || {}).reduce((a, b) => a + b, 0);

function renderSignin(msg) {
  app.innerHTML = `<h1>Poll admin</h1>
  <form class="card signin" id="f">
    <label for="code">Admin code</label>
    <input id="code" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button>
    <div class="err">${Poll.esc(msg || '')}</div></form>`;
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const c = document.getElementById('code').value.trim();
    try {
      if (await Poll.checkCode(c)) { code = c; ss('livepoll-code', c); start(); }
      else renderSignin('That code is not right.');
    } catch (err) { renderSignin('Cannot reach the poll server.'); }
  };
  document.getElementById('code').focus();
}

function render() {
  const all = Q.reduce((s, _, i) => s + totalOf(i), 0);
  const shortSite = site.replace(/^https?:\/\//, '');
  app.innerHTML = `<h1>Poll admin</h1>
  <section class="card">
    <h2>Responses so far</h2>
    ${Q.map((q, i) => `<div class="row"><span class="n">Q${i + 1}</span><span class="t">${Poll.esc(q.text)}</span><span class="c">${totalOf(i)}</span></div>`).join('')}
    <div class="actions">
      <button data-act="csv">Download results</button>
      <button class="danger" data-act="reset" ${all ? '' : 'disabled'}>Reset all responses</button>
    </div>
    <p class="hint">Reset after each presentation. Download first if you want to keep the results.</p>
  </section>
  <section class="card">
    <h2>Slide links</h2>
    ${Q.map((q, i) => `<div class="row"><span class="n">Q${i + 1}</span>
      <span class="t"><a href="${site}/q${i + 1}" target="_blank" rel="noopener">${Poll.esc(shortSite)}/q${i + 1}</a></span>
      <button class="small" data-copy="${site}/q${i + 1}">Copy</button></div>`).join('')}
    <p class="hint">Put each link on its question's slide. Clicking it opens the question on everyone's phone and shows the live results.</p>
  </section>`;
}

function csv() {
  const rows = [['Question #', 'Question', 'Choice', 'Percent']];
  Q.forEach((q, i) => {
    const t = totalOf(i);
    q.choices.forEach((c, j) => {
      const n = (counts[i] || {})[j] || 0;
      rows.push([i + 1, q.text, c, t ? Math.round(n / t * 100) + '%' : '0%']);
    });
    rows.push([i + 1, q.text, 'Responses', t]);
  });
  const text = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
  a.download = `poll-results-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

app.addEventListener('click', async e => {
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    try { await navigator.clipboard.writeText(cp.dataset.copy); toast('Link copied'); }
    catch (err) { toast(cp.dataset.copy); }
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'csv') { csv(); return; }
  if (b.dataset.act === 'reset') {
    // Two clicks: the first arms the button, the second resets.
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); b.textContent = 'Click again to reset';
      setTimeout(() => { if (b.isConnected && b.classList.contains('armed')) { b.classList.remove('armed'); b.textContent = 'Reset all responses'; } }, 4000);
      return;
    }
    b.classList.remove('armed');
    try {
      const r = await Poll.clear(code, null);
      if (r === 'denied') { ss('livepoll-code', null); renderSignin('The admin code changed. Sign in again.'); return; }
      await Poll.setCurrent(code, -1);   // also close voting on the phones
      toast('All responses reset');
    } catch (err) { toast('Cannot reach the poll server'); }
    await refresh();
  }
});

async function refresh() {
  if (!code) return;
  try {
    counts = await Poll.counts(null);
    if (!app.querySelector('.armed')) render();
  } catch (err) { /* keep the last view */ }
}

let subscribed = false;
async function start() {
  await refresh();
  if (!subscribed) { subscribed = true; Poll.subscribe(refresh); }
}

if (!Poll.ready) app.innerHTML = '<div class="card">The poll library did not load. Check the internet connection.</div>';
else {
  const saved = ss('livepoll-code');
  if (saved) { code = saved; start(); } else renderSignin();
}
</script>
</body>
</html>
