<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Live Poll Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#183A78;--navy-dark:#122C5C;--orange:#FF832B;--green:#349A03;--red:#E21837;
  --bg:#F4F7FB;--card:#FFFFFF;--ink:#1E2733;--muted:#5E6B7A;--line:#DCE3EC;--soft:#ECF2F9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0E1622;--card:#172231;--ink:#EEF2F7;--muted:#9AA8B8;--line:#2A3747;--soft:#1E2B3B}
}
:root[data-theme="dark"]{--bg:#0E1622;--card:#172231;--ink:#EEF2F7;--muted:#9AA8B8;--line:#2A3747;--soft:#1E2B3B}
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--navy-dark);color:#fff;padding:14px 16px;border-bottom:4px solid var(--orange);display:flex;align-items:center;gap:12px}
header h1{font-size:18px;font-weight:600;flex:1}
header .mode{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.15)}
main{max-width:920px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:12px}
.kpis{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.kpi b{display:block;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpis .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:500 14px Outfit,system-ui,sans-serif;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--navy)}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
button.danger{color:var(--red)}
button.armed{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;width:70px}
td.btns{text-align:right;white-space:nowrap;width:1%}
td.btns button{margin-left:6px}
tr.live td:first-child{box-shadow:inset 4px 0 0 var(--green)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#E6F4DD;color:#256E02;margin-left:8px;vertical-align:2px}
.links{display:grid;gap:8px}
.link{display:flex;gap:8px;align-items:center}
.link label{width:140px;flex:none;font-size:13px;color:var(--muted)}
.link input{flex:1;min-width:0;font:13px ui-monospace,Consolas,monospace;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin-top:10px}
.signin{max-width:380px;margin:60px auto;display:grid;gap:12px}
.signin input{font:16px Outfit,system-ui,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.err{color:var(--red);font-size:14px;min-height:20px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy-dark);color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:640px){
  .link{flex-wrap:wrap}.link label{width:100%}
  td.btns{white-space:normal}td.btns button{margin:3px 0 0 4px}
  .kpis .actions{margin-left:0}
}
</style>
</head>
<body>
<header><h1>Live Poll Admin</h1><span class="mode" id="mode"></span></header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="poll.js"></script>
<script>
const app = document.getElementById('app');
const Q = Poll.questions;
let code = null, current = -1, counts = {};
document.getElementById('mode').textContent = Poll.live ? 'Live (Supabase)' : 'Demo mode';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function ss(k, v) { try { v === undefined ? (v = sessionStorage.getItem(k)) : (v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v)); } catch (e) { v = null; } return v; }

function renderSignin(msg) {
  app.innerHTML = `<form class="card signin" id="f">
    <h2>Admin code</h2>
    <input id="code" type="password" autocomplete="current-password" placeholder="${Poll.live ? 'The code from setup.sql' : 'Demo code: demo'}" required>
    <button class="primary" type="submit">Sign in</button>
    <div class="err">${Poll.esc(msg || '')}</div></form>`;
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const c = document.getElementById('code').value.trim();
    try {
      if (await Poll.checkCode(c)) { code = c; ss('livepoll-code', c); start(); }
      else renderSignin('That code is not right.');
    } catch (err) { renderSignin('Cannot reach the poll server.'); }
  };
  document.getElementById('code').focus();
}

const totalOf = qi => Object.values(counts[qi] || {}).reduce((a, b) => a + b, 0);

function base() { return new URL('results.html', location.href).href.split('?')[0]; }
function slideUrl(n) { return `${base()}?q=${n}&key=${encodeURIComponent(code)}`; }

function render() {
  const all = Q.reduce((s, _, i) => s + totalOf(i), 0);
  app.innerHTML = `
  <section class="card">
    <div class="kpis">
      <div class="kpi"><b>${current >= 0 && Q[current] ? 'Q' + (current + 1) : 'Closed'}</b><span>Live question</span></div>
      <div class="kpi"><b>${current >= 0 ? totalOf(current) : '–'}</b><span>Answers on it</span></div>
      <div class="kpi"><b>${all}</b><span>Answers in all</span></div>
      <div class="actions">
        <button data-act="close" ${current < 0 ? 'disabled' : ''}>Close voting</button>
        <button data-act="csv">Download CSV</button>
        <button class="danger" data-act="clearall">Clear all results</button>
      </div>
    </div>
  </section>
  <section class="card">
    <h2>Questions</h2>
    <table><thead><tr><th>#</th><th>Question</th><th style="text-align:right">Answers</th><th></th></tr></thead><tbody>
    ${Q.map((q, i) => `<tr class="${i === current ? 'live' : ''}">
      <td>${i + 1}</td>
      <td>${Poll.esc(q.text)}${i === current ? '<span class="badge">Live</span>' : ''}</td>
      <td class="n">${totalOf(i)}</td>
      <td class="btns">
        <button class="primary" data-act="open" data-q="${i}" ${i === current ? 'disabled' : ''}>Open</button>
        <button data-act="view" data-q="${i}">View</button>
        <button class="danger" data-act="clear" data-q="${i}">Clear</button>
      </td></tr>`).join('')}
    </tbody></table>
  </section>
  <section class="card">
    <h2>Links for your slides</h2>
    <div class="links">
      <div class="link"><label>Vote page (QR)</label><input readonly value="${Poll.esc(Poll.voteUrl())}"><button data-copy>Copy</button></div>
      <div class="link"><label>Join slide</label><input readonly value="${Poll.esc(slideUrl(0))}"><button data-copy>Copy</button></div>
      ${Q.map((_, i) => `<div class="link"><label>Question ${i + 1} slide</label><input readonly value="${Poll.esc(slideUrl(i + 1))}"><button data-copy>Copy</button></div>`).join('')}
    </div>
    <p class="hint">Put each slide link in a PowerPoint Web Viewer box. When the slide shows, that question opens on every phone. These links hold your admin code, so keep the deck private.</p>
  </section>
  <p class="hint" style="text-align:center"><button data-act="signout">Sign out</button></p>`;
}

// Two-step buttons: the first click arms, the second click acts.
function armed(btn) {
  if (btn.classList.contains('armed')) return true;
  const label = btn.textContent;
  btn.classList.add('armed'); btn.textContent = 'Click again to clear';
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = label; } }, 3500);
  return false;
}

function csv() {
  const rows = [['Question #', 'Question', 'Choice', 'Answers', 'Percent']];
  Q.forEach((q, i) => {
    const t = totalOf(i);
    q.choices.forEach((c, j) => {
      const n = (counts[i] || {})[j] || 0;
      rows.push([i + 1, q.text, c, n, t ? Math.round(n / t * 100) + '%' : '0%']);
    });
  });
  const text = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
  a.download = `live-poll-results-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

app.addEventListener('click', async e => {
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    const input = cp.previousElementSibling;
    try { await navigator.clipboard.writeText(input.value); } catch (err) { input.select(); document.execCommand('copy'); }
    toast('Link copied'); return;
  }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, q = b.dataset.q != null ? Number(b.dataset.q) : null;
  if (b.classList.contains('armed')) b.classList.remove('armed');   // second click: act, and let the view redraw
  else if (act === 'clear' || act === 'clearall') { armed(b); return; }
  try {
    let r = 'ok';
    if (act === 'open') { r = await Poll.setCurrent(code, q); if (r === 'ok') toast(`Question ${q + 1} is open on every phone`); }
    else if (act === 'close') { r = await Poll.setCurrent(code, -1); if (r === 'ok') toast('Voting closed'); }
    else if (act === 'view') { window.open(`${base()}?q=${q + 1}`, '_blank'); return; }
    else if (act === 'csv') { csv(); return; }
    else if (act === 'signout') { ss('livepoll-code', null); code = null; renderSignin(); return; }
    else if (act === 'clear') { r = await Poll.clear(code, q); if (r === 'ok') toast(`Question ${q + 1} cleared`); }
    else if (act === 'clearall') { r = await Poll.clear(code, null); if (r === 'ok') toast('All results cleared'); }
    if (r === 'denied') { ss('livepoll-code', null); renderSignin('The admin code changed. Sign in again.'); return; }
    await refresh();
  } catch (err) { toast('Cannot reach the poll server'); }
});

async function refresh() {
  if (!code) return;
  try {
    [current, counts] = await Promise.all([Poll.current(), Poll.counts(null)]);
    // Keep an armed button armed: skip the redraw while one is waiting for its second click.
    if (!app.querySelector('.armed')) render();
  } catch (err) { /* keep the last view */ }
}

let subscribed = false;
async function start() {
  await refresh();
  if (!subscribed) { subscribed = true; Poll.subscribe(refresh); }
}

if (!Poll.ready) app.innerHTML = '<div class="card">The Supabase library did not load. Check the internet connection.</div>';
else {
  const saved = ss('livepoll-code');
  if (saved) { code = saved; start(); } else renderSignin();
}
</script>
</body>
</html>
